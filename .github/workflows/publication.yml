# Tests, build et publication sur Cloudflare Pages (projet « panier-temoin »), puis vérification
# du site publié. Chantier B : D-004 et D-013 (ECOSYSTEME.md).
#
# À chaque envoi sur « main » :
#   1. backend : migrations, tests SQL et démonstration sur un Postgres 16 ;
#   2. app : tests, vérification des types, build, puis parcours de l'app construite (une violation
#      de CSP ou une erreur de page bloque la publication) et changement d'adresse de bout en bout ;
#   3. publication sur https://panier-temoin.pages.dev (le projet Cloudflare est créé s'il manque) ;
#   4. vérification du site publié (version servie, en-têtes, manifeste, liens de Claude, hors ligne) ;
#   5. résultat sur la branche « ci-statut » (statut.json), lisible même si le dépôt devient privé.
# L'ancienne adresse (https://django184.github.io/panier-temoin/) n'est plus publiée ici : elle garde
# la version 0.6.0 jusqu'au passage au passeur (workflow « Passeur de l'ancienne adresse »).

name: Tests et publication

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJET: panier-temoin
  SITE: https://panier-temoin.pages.dev/

jobs:
  backend:
    name: Backend (Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Migrations, tests et démonstration
        run: |
          for fichier in \
            supabase/tests/local/supabase_minimal.sql \
            supabase/migrations/*.sql \
            supabase/tests/tests_backend.sql \
            supabase/demo/donnees_demo.sql \
            supabase/demo/verifier_demo.sql \
            supabase/demo/purge_demo.sql
          do
            echo "→ $fichier"
            psql -X -q -v ON_ERROR_STOP=1 -o /dev/null -f "$fichier"
          done

  app:
    name: App (tests, types, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Installation des dépendances
        run: npm install --no-audit --no-fund
      - name: Tests du lecteur de ticket
        run: npm test
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Codes-barres EAN-13 relus par un décodeur indépendant
        run: |
          node scripts/codes_de_test.ts codes-test
          pip install --quiet zxing-cpp pillow
          python scripts/verifier_codes.py codes-test
      - name: Vérification des types et build
        run: npm run build
      - name: Parcours de l'app construite (CSP et erreurs de page bloquantes)
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort &
          npx --yes wait-on --timeout 60000 http://localhost:4173/
          node scripts/captures.mjs
      - name: Changement d'adresse (passeur, service worker d'autodestruction, reprise)
        run: node scripts/demenagement.mjs
      - name: Conservation du build
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          include-hidden-files: true
          retention-days: 7

  publication:
    name: Publication Cloudflare Pages
    if: github.ref == 'refs/heads/main'
    needs: [backend, app]
    runs-on: ubuntu-latest
    outputs:
      publie: ${{ steps.deploy.outcome }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Secrets absents
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::warning::Publication NON faite : secrets Cloudflare absents (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID)."
          {
            echo "## ⚠️ Publication non faite"
            echo "Les secrets \`CLOUDFLARE_API_TOKEN\` et \`CLOUDFLARE_ACCOUNT_ID\` sont introuvables"
            echo "(Settings → Secrets and variables → Actions → Repository secrets)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Projet Cloudflare Pages (créé s'il n'existe pas, adresse vérifiée)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          code=$(curl -sS -o projet.json -w '%{http_code}' -H "$auth" "$api/$PROJET")
          if [ "$code" = 404 ]; then
            echo "Projet $PROJET absent : création."
            code=$(curl -sS -o projet.json -w '%{http_code}' -X POST -H "$auth" -H 'Content-Type: application/json' \
              --data "{\"name\":\"$PROJET\",\"production_branch\":\"main\"}" "$api")
          fi
          if [ "$code" != 200 ]; then
            echo "::error::API Cloudflare ($code) : $(jq -c '.errors' projet.json)"; exit 1
          fi
          sous_domaine=$(jq -r '.result.subdomain' projet.json)
          branche=$(jq -r '.result.production_branch' projet.json)
          echo "Projet $PROJET : $sous_domaine (branche de production : $branche)"
          if [ "https://$sous_domaine/" != "$SITE" ]; then
            echo "::error::Cloudflare a attribué https://$sous_domaine/ au lieu de $SITE : mettre à jour ADRESSE_APP (src/config.ts), le workflow et le passeur."; exit 1
          fi
          if [ "$branche" != main ]; then
            echo "::error::Branche de production « $branche » au lieu de « main »."; exit 1
          fi
      - name: Build testé
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - name: Publication sur Cloudflare Pages
        id: deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=panier-temoin --branch=main --commit-dirty=true
      - name: Résumé
        if: steps.deploy.outcome == 'success'
        run: echo "## ✅ Publiée sur $SITE ($(jq -r '.version + "+" + .commit' dist/version.json))" >> "$GITHUB_STEP_SUMMARY"

  # Le site réellement publié. Ne republie rien.
  en_ligne:
    name: Site publié
    needs: publication
    if: needs.publication.outputs.publie == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Attendre la nouvelle version en ligne
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${SITE}version.json?ci=${GITHUB_RUN_ID}-$i" | grep -q "\"${GITHUB_SHA::7}\""; then
              echo "En ligne : ${GITHUB_SHA::7}"; exit 0
            fi
            sleep 10
          done
          echo "::error::Le site ne sert pas ${GITHUB_SHA::7} après 5 minutes"
          exit 1
      - name: Site publié (en-têtes, manifeste, liens de Claude, hors ligne)
        run: |
          npm install --no-save --no-audit --no-fund --no-package-lock playwright
          npx playwright install --with-deps chromium
          node scripts/en_ligne.mjs "$SITE"
      - name: Résumé
        if: always()
        run: |
          if [ "${{ job.status }}" = success ]; then
            echo "## ✅ Site publié vérifié : version, en-têtes, manifeste, liens de Claude et hors ligne" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ❌ Site publié : vérification en échec (voir le journal de ce job)" >> "$GITHUB_STEP_SUMMARY"
          fi

  statut:
    needs: [backend, app, publication, en_ligne]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Écrire statut.json sur la branche ci-statut
        env:
          TESTS: ${{ needs.backend.result == 'success' && needs.app.result == 'success' && 'success' || 'failure' }}
          PUBLICATION: ${{ needs.publication.result }}
          PUBLIE: ${{ needs.publication.outputs.publie }}
          EN_LIGNE: ${{ needs.en_ligne.result }}
          TOKEN: ${{ github.token }}
        run: |
          mkdir statut && cd statut && git init -q -b ci-statut
          printf '{"commit":"%s","tests":"%s","publication":"%s","publie":"%s","en_ligne":"%s","date":"%s","run":"%s/%s/actions/runs/%s"}\n' \
            "$GITHUB_SHA" "$TESTS" "$PUBLICATION" "${PUBLIE:-skipped}" "${EN_LIGNE:-skipped}" "$(date -u +%FT%TZ)" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > statut.json
          cat statut.json
          git add statut.json
          git -c user.name="CI" -c user.email="ci@users.noreply.github.com" commit -qm "CI ${GITHUB_SHA::7} : tests $TESTS, publication $PUBLICATION, en ligne ${EN_LIGNE:-skipped}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-statut
